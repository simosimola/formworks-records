<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title} — Formworks</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1a1718;--fg:#f1f4f5;--muted:#888}
body{font-family:'Archivo',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.container{max-width:1400px;margin:0 auto;padding:0 1.5rem}
header{border-bottom:2px solid var(--fg)}
header .container{display:flex;align-items:center;justify-content:space-between;padding-top:1rem;padding-bottom:1rem}
.logo-link{display:flex;align-items:center;gap:0.75rem}
.logo-link img{height:2.5rem;width:2.5rem}
.logo-link span{font-size:1.125rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase}
nav{display:flex;gap:0.25rem}
nav a{padding:0.5rem 1rem;font-size:0.875rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;transition:background 0.2s,color 0.2s}
nav a:hover,nav a.active{background:var(--fg);color:var(--bg)}
.noise-overlay{pointer-events:none;position:fixed;inset:0;z-index:9999;opacity:0.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
footer{border-top:2px solid var(--fg);padding:1.5rem 0;text-align:center;font-size:0.875rem;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;margin-top:auto}
main{flex:1}
.section-title{font-size:2rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3rem;padding-bottom:1rem;border-bottom:2px solid var(--fg)}
.card-grid{display:grid;gap:0}
.card-grid.cols-3{grid-template-columns:repeat(3,1fr)}
.card-grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:768px){.card-grid.cols-3,.card-grid.cols-4{grid-template-columns:1fr}}
.card{border:2px solid var(--fg);transition:background 0.2s,color 0.2s;overflow:hidden}
.card:hover{background:var(--fg);color:var(--bg)}
.card .card-img-wrap{overflow:hidden}
.card img{width:100%;aspect-ratio:1;object-fit:cover;filter:grayscale(100%);transition:filter 0.5s,transform 0.5s}
.card:hover img{filter:grayscale(0%);transform:scale(1.1)}
.card .card-body{padding:1.5rem}
.card h2{font-size:1.25rem;font-weight:700;letter-spacing:0.05em;text-transform:uppercase}
.card .card-meta{font-size:0.75rem;font-weight:700;letter-spacing:0.1em;color:var(--muted)}
.card:hover .card-meta{color:rgba(26,23,24,0.5)}
.card .card-desc{font-size:0.875rem;color:var(--muted);letter-spacing:0.03em;margin-top:0.5rem}
.card:hover .card-desc{color:rgba(26,23,24,0.7)}
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;padding:1.5rem;text-align:center}
.home img{width:8rem;height:8rem;margin-bottom:2rem}
.home h1{font-size:clamp(2rem,5vw,3.75rem);font-weight:700;letter-spacing:0.1em;margin-bottom:1rem;text-transform:uppercase}
.home p{color:var(--muted);font-size:1.125rem;max-width:36rem;margin-bottom:3rem;letter-spacing:0.05em}
.home-links{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center}
.home-links a{border:2px solid var(--fg);padding:0.75rem 2rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;font-size:0.875rem;transition:background 0.2s,color 0.2s}
.home-links a:hover{background:var(--fg);color:var(--bg)}
.about{max-width:42rem;margin:0 auto;padding:4rem 1.5rem}
.about p{font-size:0.875rem;line-height:1.8;letter-spacing:0.03em;margin-bottom:1.5rem}
.about .muted{color:var(--muted)}
.artist-detail{max-width:42rem;margin:0 auto;padding:4rem 1.5rem}
.artist-detail img{width:100%;aspect-ratio:16/9;object-fit:cover;border:2px solid var(--fg);margin-bottom:3rem}
.artist-detail .back{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);display:inline-block;margin-bottom:2rem;transition:color 0.2s}
.artist-detail .back:hover{color:var(--fg)}
.artist-detail .bio{font-size:0.875rem;line-height:1.8;letter-spacing:0.03em;margin-bottom:1.5rem}
.artist-detail .bio.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="noise-overlay"></div>
<header>
<div class="container">
<a class="logo-link" href="index.html">
<img src="resources/logos/formworks-logo.svg" alt="Formworks">
<span>FoЯmworks</span>
</a>
<nav><a href="index.html">Home</a>
<a href="artists.html" class="active">Artists</a>
<a href="releases.html">Releases</a>
<a href="about.html">About</a></nav>
</div>
</header>
<main>
<div class="container" style="padding-top:4rem;padding-bottom:4rem">
<h1 class="section-title">Artists</h1>
<div class="card-grid cols-3">
<a href="artist-gangoon.html"><div class="card"><div class="card-img-wrap"><img src="resources/artist-logos/gangoon.webp" alt="Gangoon"></div><div class="card-body"><h2>Gangoon</h2><p class="card-desc">Jungle & Breakbeats</p></div></div></a><a href="artist-zzb.html"><div class="card"><div class="card-img-wrap"><img src="resources/artist-logos/final.webp" alt="ZZB"></div><div class="card-body"><h2>ZZB</h2><p class="card-desc">IDM & Modular Synthesis</p></div></div></a><div class="card"><div class="card-img-wrap"><img src="resources/artist-logos/artist-three.webp" alt="Artist Three"></div><div class="card-body"><h2>Artist Three</h2><p class="card-desc">Dark ambient textures and industrial rhythms.</p></div></div>
</div>
</div></main>
<footer>
<div class="container">&copy; 2026 Formworks. All rights reserved.</div>
</footer>
</body>
</html>
